# solardash configuration. Copy to config.yaml and edit.
# Serial device names: prefer the stable /dev/serial/by-id/... or by-path
# symlinks over /dev/ttyACMn, which renumber after a USB hiccup.

simulate: false          # true = run with fake devices (no hardware needed)
log_level: INFO

inverter:
  enabled: true
  name: EG4 6000XP
  port: /dev/ttyACM0     # RS485 to the inverter's dongle/INV485 port
  baud: 19200
  unit: 1
  poll_interval: 2       # seconds between live-data polls
  settings_poll_interval: 60
  allow_writes: false    # must be true before any setting can be changed from the UI/API

batteries:               # one entry per RS485 link (Solar Assistant "USB JBD RS485")
  - name: Battery 1
    port: /dev/ttyACM1
    baud: 9600
    capacity_ah: 100
  - name: Battery 2
    port: /dev/ttyACM2
    baud: 9600
    capacity_ah: 100
  - name: Battery 3
    port: /dev/ttyACM3
    baud: 9600
    capacity_ah: 100

chargeverter:
  # The Chargeverter is a dumb AC->DC charger here: Home Assistant starts the
  # generator and closes the contactor, and solardash infers its output from
  # BMS pack power minus inverter battery power. No wiring to it is needed.
  # An RS485 link to its BMS RJ45 (pin 1 = B, pin 2 = A) is optional: "sniff"
  # shows its SOC polls, "emulate" answers them so its display shows a real SOC.
  enabled: false
  mode: off              # off | sniff | emulate
  port: /dev/ttyUSB0
  baud: 9600
  parity: N
  power_threshold_w: 150 # derived Chargeverter output below this is reported as 0
  emulate:
    soh: 100
    charge_voltage: 56.0
    charge_limit_a: 100
    discharge_limit_a: 100
    stale_after: 30      # stop answering if battery data is older than this (fail-safe)
    soc_offset: 0

# Generators that can feed the Chargeverter. Only one runs at a time (cam switch);
# pick the active one in the web UI and solardash accrues run hours to it.
generators:   # each also takes tank_hours (default 8) and oil_change_h (default 50)
  - name: Outhouse generator (auto-start)
    notes: Honda EU3000is, remote start
    # Home Assistant knows when this one runs (12 V sense wire on a Waveshare
    # Modbus relay). Publish that state here (retained) and solardash uses it
    # for run hours and shows "warming up" until the contactor closes.
    running_topic: solardash/generator/outhouse/running
    contactor_topic: solardash/generator/outhouse/contactor
    signal_stale_s: 21600
  - name: Porch generator
    notes: Honda EU3000is, plugged in during winter stays (no sense wire; inferred from Chargeverter output)

weather:
  # Open-Meteo (free, no key) supplies the hourly irradiance forecast the PV
  # model runs on; it only needs latitude/longitude. The Weather Underground
  # station adds real measured conditions (solar radiation, temperature) and
  # the narrative forecast. Enable either or both.
  openmeteo_enabled: true
  openmeteo_interval: 3600
  openmeteo_days: 7
  enabled: false         # Weather Underground station below
  provider: wunderground
  api_key: ""            # PWS owner key from wunderground.com/member/api-keys (or env SOLARDASH_WU_API_KEY)
  station_id: KXXXXXXX   # your station; its solar radiation sensor (if any) calibrates the PV model
  latitude: null         # defaults to the station's position
  longitude: null
  units: e
  poll_interval: 300
  forecast_interval: 1800

planner:
  enabled: true
  # The Chargeverter fixes the generator's load, so every engine hour costs about the same fuel and wear.
  # The planner minimises engine hours and starts: fewer, longer runs, timed as late as is safe, sized so
  # it never charges what the sun will cover.
  soc_floor: 25          # never plan to go below
  soc_ceiling: 90        # never charge past this with the generator (LFP charging tapers above it)
  min_run_h: 1.5         # shorter runs never get the engine and oil fully hot
  max_run_h: 8.0         # one tank
  start_cost_h: 0.5      # fuel + wear of a cold start and warm-up, in engine hours
  storm_lookahead_h: 48  # later starts beyond this are weighed at half (forecast uncertainty)
  soc_margin: 3
  generator_dc_kw: 1.56  # Chargeverter DC output: 30 A x ~52 V
  charge_efficiency: 0.94
  quiet_hours: []        # e.g. ["22:00-07:00"] if the outhouse generator must not run at night
  horizon_h: 72
  pv_kw_peak: 6.0        # array size, used until the model has learned from history
  battery_kwh: null      # default: bank Ah x 51.2 V
  recompute_interval: 300

occupancy:
  # Cabin load is very different occupied vs away. The current mode is set in
  # the UI, via PUT /api/occupancy or MQTT <prefix>/occupancy/set, and the
  # load profile is learned per mode.
  enabled: true
  modes: [occupied, away]
  default: away

history:
  path: data/solardash.db
  sample_interval: 15
  retention_days: 0      # raw samples: 0 = no age limit, only the size cap below
  max_db_gb: 25          # oldest raw days roll off past this; hourly rollups are kept forever

web:
  host: 0.0.0.0
  port: 8080
  password: ""          # optional login for the UI/API (or env SOLARDASH_PASSWORD); second layer behind Cloudflare Access

mqtt:
  enabled: false
  host: 192.168.1.10
  port: 1883
  username: ""
  password: ""
  prefix: solar_assistant   # topics mirror Solar Assistant: <prefix>/inverter_1/pv_power/state ...
  ha_discovery: true
  ha_prefix: homeassistant
  publish_interval: 5
