[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solardash"
version = "0.1.0"
description = "Local monitoring and control for an EG4 6000XP, Eco-Worthy (JBD) rack batteries and an EG4 Chargeverter GC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "paho-mqtt>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
solardash = "solardash.__main__:main"

[tool.setuptools.packages.find]
include = ["solardash*"]

[tool.setuptools.package-data]
solardash = ["api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
