# solardash — the only file you need.
#
#   1. File Station: make a folder (e.g. docker/solardash) and put this file in it.
#   2. Container Manager -> Project -> Create -> choose that folder -> Start.
#   3. Open http://<nas-ip>:8080 -> System -> Setup: pick the serial ports,
#      enter your coordinates, and (optionally) the weather key, MQTT, password.
#
#   Update: Container Manager -> Image -> solardash -> Update, then
#           Project -> solardash -> Action -> Restart.
#
# Everything you set on the Setup page is kept in the "solardash-data" volume,
# so updates never lose it. (A config.yaml is optional; see README.)
services:
  solardash:
    image: ghcr.io/marvsmufflers/solardash:latest
    pull_policy: always
    container_name: solardash
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - solardash-data:/app/data
      - /dev:/dev                   # all USB serial adapters, hot-plug safe
    privileged: true                # needed on Synology to open the adapters
    environment:
      - TZ=America/Los_Angeles
      - SOLARDASH_PASSWORD=         # optional login for the dashboard

  # Cloudflare Tunnel (remote access). Paste your tunnel token after the "=".
  # Already running the tunnel in its own container? Delete this whole block.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: solardash-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=
    depends_on:
      - solardash

volumes:
  solardash-data:
