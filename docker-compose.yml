# solardash on a Synology (Container Manager) or any Docker host. No SSH needed:
#   1. In File Station make a folder (e.g. docker/solardash) and put this file,
#      config.yaml (copy of config.example.yaml, edited) and an empty "data"
#      folder in it.
#   2. Container Manager -> Project -> Create -> pick that folder -> Start.
#   3. Update later: Container Manager -> Image -> solardash -> Update, then
#      Project -> solardash -> Action -> Restart. (Or Project -> Build.)
# Find your serial adapters afterwards on the dashboard's System tab.
services:
  solardash:
    image: ghcr.io/marvsmufflers/solardash:latest   # built automatically from GitHub
    pull_policy: always
    # To build from source instead, remove the image line and uncomment:
    # build: .
    container_name: solardash
    restart: unless-stopped
    ports:
      - "8080:8080"            # LAN access; the tunnel reaches it on the compose network
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data      # history database and Setup-page overrides
    # Serial adapters. Names can shift after a USB re-enumeration; the app
    # reopens them, but if the order changes edit config.yaml.
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
      - /dev/ttyACM1:/dev/ttyACM1
      - /dev/ttyACM2:/dev/ttyACM2
      - /dev/ttyACM3:/dev/ttyACM3
    environment:
      - TZ=America/Los_Angeles
      - SOLARDASH_LOG_LEVEL=INFO
      - SOLARDASH_PASSWORD=          # optional dashboard login (second layer behind Cloudflare Access)
      - SOLARDASH_WU_API_KEY=        # or set it on the Setup page
      # - SOLARDASH_SIMULATE=true    # run without hardware

  # Cloudflare Tunnel connector. Paste the tunnel token from Zero Trust ->
  # Networks -> Tunnels. Delete this whole service if you run the tunnel some
  # other way (e.g. its own container already set up in Container Manager).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: solardash-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=
    depends_on:
      - solardash
