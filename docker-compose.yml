# solardash — the only file you need. Put it in a folder on the NAS (the one
# you already use is fine) and point a Container Manager project at it.
#
# Settings and history live in the "data" folder next to this file, so
# replacing this file, updating the image or recreating the project keeps them.
# A config.yaml next to this file is optional and is picked up if present.
services:
  solardash:
    image: ghcr.io/marvsmufflers/solardash:latest
    pull_policy: always
    container_name: solardash
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data            # settings + history (kept across updates)
      - ./:/app/host:ro             # lets the app read an optional config.yaml
      - /dev:/dev                   # all USB serial adapters, hot-plug safe
      - /etc/localtime:/etc/localtime:ro   # use the NAS's time zone
    privileged: true                # needed on Synology to open the adapters
    environment:
      - SOLARDASH_CONFIG=/app/host/config.yaml
      - SOLARDASH_PASSWORD=         # optional login for the dashboard

  # Cloudflare Tunnel. Paste your tunnel token after the "=" below.
  # (Cloudflare Zero Trust -> Networks -> Tunnels -> your tunnel -> Configure;
  # the token is the long string after "--token" in the install command.)
  # Running the tunnel some other way? Delete this whole block.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: solardash-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=
    depends_on:
      - solardash
